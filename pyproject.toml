[project]
name = "fastapi-filter"
version = "3.0.0"
description = "FastAPI filter"
authors = [{ name = "Arthur Rio", email = "arthur.rio44@gmail.com" }]
requires-python = ">=3.12"
readme = "README.md"
license = "MIT"
classifiers = [
    "Natural Language :: English",
    "Framework :: FastAPI",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3 :: Only",
]
dependencies = [
    "fastapi>=0.115.0,<1.0",
    "pydantic>=2.12.0,<3.0.0",
]

[project.optional-dependencies]
mongoengine = ["mongoengine>=0.28.0,<0.30.0"]
beanie = ["beanie>=2.0.0,<3.0.0"]
sqlalchemy = ["SQLAlchemy[asyncio]>=2.0.0,<3.0.0"]
all = [
    "fastapi-filter[sqlalchemy]",
    "fastapi-filter[beanie]",
    "fastapi-filter[mongoengine]",
]

[project.urls]
Repository = "https://github.com/arthurio/fastapi-filter"

[tool.flynt]
line-length = 120

[dependency-groups]
dev = [
    "Faker>=26.0.0,<27",
    "SQLAlchemy[asyncio]>=2.0.0,<3.0.0",
    "SQLAlchemy-Utils>=0.41.2,<0.42",
    "aiosqlite>=0.20.0,<0.21",
    "bandit>=1.7.9,<2",
    "flynt>=1.0.1,<2",
    "httpx>=0.28.0,<0.29",
    "ipython>=8.11.0,<9",
    "mkdocs-material>=9.5.21,<10",
    "mypy>=2.0.0,<3",
    "mypy-extensions>=1.0.0,<2",
    "nox>=2024.4.15,<2025",
    "pre-commit>=3.7.1,<4",
    "pydantic[email]>=2.12.0,<3",
    "pytest>=9.0.0,<10",
    "pytest-asyncio>=1.4.0,<2",
    "pytest-cov>=5.0.0,<6",
    "python-lsp-server>=1.11.0,<2",
    "requests>=2.32.3,<3",
    "ruff>=0.8.0",
    "tomli>=2.0.1,<3",
    "types-click>=7.1.8,<8",
    "types-setuptools>=70.1.0.20240627,<71",
    "typing-extensions>=4.12.2,<5",
    "urllib3<=2.5.0",
    "uvicorn>=0.30.1,<0.31",
]

[tool.mypy]
mypy_path = [
  "fastapi_filter",
]
show_error_codes = true
check_untyped_defs = true

[tool.uv]
default-groups = "all"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[[tool.mypy.overrides]]
module = [
  "beanie",
  "beanie.*",
  "bson.objectid",
  "mongoengine.*",
  "uvicorn.*",
]
ignore_missing_imports = true

[tool.ruff]
line-length = 120
# Assume Python 3.12 as the minimum supported version.
target-version = "py312"
# Exclude a variety of commonly ignored directories.
exclude = [
    ".git",
    ".mypy_cache",
    ".nox",
    ".ruff_cache",
]


[tool.ruff.lint]
select = [
  "A",
  "B",
  "C",
  "D",
  "E",
  "F",
  "I",
  "SIM",
  "UP",
]
ignore = [
  "A003",  # Argument name should be lowercase.
  "B008",  # Do not perform function calls in argument defaults.
  "D1",  # Missing docstring https://www.pydocstyle.org/en/2.1.1/error_codes.html.
  "D203",  # 1 blank line required before class docstring.
  "D213",  # Multi-line docstring summary should start at the second line.
]

# Allow autofix for all enabled rules (when `--fix`) is provided.
fixable = [
  "A",
  "B",
  "C",
  "D",
  "E",
  "F",
  "I",
  "SIM",
  "UP",
]
unfixable = []

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.isort]
known-first-party = [
  "fastapi_filter",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
# Like Black, use double quotes for strings.
quote-style = "double"
# Like Black, indent with spaces, rather than tabs.
indent-style = "space"
# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false
# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"

[tool.coverage.run]
omit = [
  "fastapi_filter/contrib/beanie/*",
  "fastapi_filter/contrib/mongoengine/*",
]
